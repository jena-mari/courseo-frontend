# Render Blueprint for the Courseo frontend.
# Create the service once with: Render Dashboard -> New -> Blueprint -> this repo.
# Deploys are triggered by the GitHub Actions workflow (.github/workflows/deploy.yml)
# after the build check passes, so Render's own auto-deploy is turned off.
services:
  - type: web
    runtime: static
    name: courseo-frontend
    plan: free
    branch: main
    autoDeploy: false
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      ignoredPaths:
        - docs/**
        - README.md
    envVars:
      # Public URL of the IntelliStudy Planner Brain backend. Set in the Render dashboard.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_COPILOT_AGENT_URL
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Uncomment to proxy API calls to the backend from the same origin instead of
      # setting VITE_API_BASE_URL, replacing the destination with the backend URL.
      # - type: rewrite
      #   source: /api/*
      #   destination: https://intelli-study-planner-brain.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
