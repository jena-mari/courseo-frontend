name: CI / Deploy to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compile check only. Render runs the real production build with the
      # environment variables configured on the Render service.
      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Render
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          response=$(curl --silent --show-error --fail-with-body \
            --write-out '\n%{http_code}' \
            --request POST "$RENDER_DEPLOY_HOOK_URL")
          echo "$response" | sed '$d'
          echo "Render deploy triggered for ${GITHUB_SHA}."
